name: Refresh outage data

# Pulls the public ThousandEyes outage feed and publishes it to the `data`
# branch as outages.json. The globe reads it from raw.githubusercontent.com,
# which sends CORS headers - the ThousandEyes endpoint itself does not.
#
# The branch is force-pushed as a single commit each run, so it never grows.
# GitHub's cron is best-effort: expect runs every 5-15 minutes, not exactly 5.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outage-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch outages
        run: node scripts/fetch-outages.mjs "$RUNNER_TEMP/out/outages.json"

      - name: Publish to data branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outages.json
          git commit -q -m "Outage data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
