<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Internet Outage Globe</title>
  <meta name="description" content="Live global Internet outages from ThousandEyes Internet Insights, on a globe. Built for Cisco RoomOS and Desk Pro displays.">
  <meta name="theme-color" content="#05070d">
  <link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="globe" aria-label="Globe showing current Internet outages"></canvas>
  <div class="sheen" id="sheen" aria-hidden="true"><i></i></div>

  <header class="brand">
    <img class="brand-logo" src="assets/te-logo.png" alt="ThousandEyes">
    <div class="brand-text">
      <h1>Internet Outages <span class="live"><i></i>LIVE</span></h1>
      <p class="sub">Internet Insights &middot; last 24 hours &middot; <span id="updated">loading&hellip;</span></p>
    </div>
  </header>

  <aside class="panel" id="panel">
    <div class="stats">
      <div class="stat"><b id="statActive">–</b><span>Active now</span></div>
      <div class="stat net"><b id="statNet">–</b><span>Network</span></div>
      <div class="stat app"><b id="statApp">–</b><span>Application</span></div>
      <div class="stat"><b id="statLoc">–</b><span>Locations</span></div>
    </div>

    <section class="watch">
      <h2>Your services</h2>
      <div class="watch-list" id="watch"></div>
    </section>

    <div class="chips" role="tablist">
      <button class="chip on" data-filter="all">All</button>
      <button class="chip" data-filter="network">Network</button>
      <button class="chip" data-filter="application">Apps</button>
    </div>
    <ol class="list" id="list"></ol>
  </aside>

  <nav class="zoomctl" aria-label="Globe controls">
    <div class="glass-wrap">
    <button id="glassBtn" class="glass-btn" aria-pressed="false" aria-label="Glass mode: camera parallax (experimental)" title="Glass mode (experimental): uses the camera to follow your head">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <span class="cam-chip" id="camChip" hidden><i></i>CAMERA</span>
    </div>
    <button id="modeBtn" class="mode-btn" aria-pressed="false" aria-label="Free mode: hide panels for a clean globe" title="Switch between HUD and Free (clean globe) mode">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path class="hud-only" d="M14.5 4.5v15M3.5 15h11"/></svg>
    </button>
    <button id="zoomReset" aria-label="Reset view"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5Z"/></svg></button>
  </nav>

  <section class="float" id="float" aria-live="polite">
    <div class="float-head">
      <div class="float-icon" id="floatIcon"></div>
      <div class="float-title"><div class="float-kind" id="floatKind"></div><div class="float-name" id="floatName"></div></div>
    </div>
    <div class="float-metrics" id="floatMetrics"></div>
    <div class="float-locs" id="floatLocs"></div>
    <div class="card-progress"><i id="floatProgress"></i></div>
  </section>

  <section class="card" id="card" hidden>
    <div class="card-head">
      <div class="card-icon" id="cardIcon"></div>
      <div class="card-title">
        <div class="card-kind" id="cardKind"></div>
        <h3 id="cardName"></h3>
      </div>
      <button class="card-close" id="cardClose" aria-label="Close">&times;</button>
    </div>
    <div class="card-metrics" id="cardMetrics"></div>
    <ul class="card-locs" id="cardLocs"></ul>
    <div class="card-progress"><i id="cardProgress"></i></div>
  </section>

  <footer class="timeline">
    <button class="tour" id="tourBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <span>Tour</span>
    </button>
    <div class="tl-chart">
      <svg id="timeline" preserveAspectRatio="none"></svg>
      <div class="tl-axis"><span>24h ago</span><span>12h</span><span>now</span></div>
    </div>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <div class="error" id="error" hidden></div>

  <script src="vendor/d3-array.min.js"></script>
  <script src="vendor/d3-geo.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/glglobe.js?v=10"></script>
  <script src="js/glass.js?v=8"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
